<text x="615" y="249.5" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">6</text>
<text x="40" y="395" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">1. CreateStream(name): the folder lists the new item at once, on an empty temporary file,</text>
<text x="40" y="413" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">    and the journal receives row T; Commit and Stat follow, Stat giving the element name.</text>
<text x="40" y="431" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">2. The stream is handed back and released without a single write.</text>
<text x="40" y="449" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">3. ParseDisplayName(name), then BindToObject(item, IStream) with the modes 0, 0x20 and 0x22.</text>
<text x="40" y="467" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">4. The last bind hands out a writable stream on the same temporary file.</text>
<text x="40" y="485" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">5. The content is written into the temporary file and the stream released.</text>
<text x="40" y="503" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">6. Row T in the journal receives the final size.</text>
</svg>
