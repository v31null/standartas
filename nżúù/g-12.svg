<text x="645" y="129.55" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">Archive as stored</text>
<path d="M250 170 L250.0 191.0" fill="none" stroke="#000" stroke-width="1"/>
<path d="M250 200 L246.0 191.0 L254.0 191.0 Z" fill="#000"/>
<text x="258" y="188" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif" font-style="italic">Yes</text>
