<text x="250" y="39.9" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">Archive opened, read or changed</text>
<path d="M250 55 L250.0 71.0" fill="none" stroke="#000" stroke-width="1"/>
<path d="M250 80 L246.0 71.0 L254.0 71.0 Z" fill="#000"/>
<path d="M250 80.0 L400.0 125 L250 170.0 L100.0 125 Z" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="250" y="121.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">Journal under</text>
<text x="250" y="138.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">either name?</text>
<path d="M400 125 L491.0 125.0" fill="none" stroke="#000" stroke-width="1"/>
<path d="M500 125 L491.0 129.0 L491.0 121.0 Z" fill="#000"/>
