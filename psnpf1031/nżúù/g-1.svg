<text x="250" y="216.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">the folder or at the</text>
<text x="250" y="233.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">destination, by the</text>
<text x="250" y="250.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">system's comparison?</text>
