<text x="640" y="416.55" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">Shortened by the rules</text>
<text x="640" y="432.55" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">of the system; extension kept</text>
<path d="M640 450 L640 500 L250 500" fill="none" stroke="#000" stroke-width="1"/>
<path d="M250 470 L250.0 516.0" fill="none" stroke="#000" stroke-width="1"/>
<path d="M250 525 L246.0 516.0 L254.0 516.0 Z" fill="#000"/>
<text x="258" y="490" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif" font-style="italic">No</text>
<rect x="110.0" y="525.0" width="280" height="50" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="250" y="546.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">Written with the date</text>
<text x="250" y="563.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">of extraction</text>
