<text x="640" y="91.55" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">Next letter suffix of Table G-2</text>
<text x="640" y="107.55" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">before the extension</text>
