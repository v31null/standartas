<path d="M640 285 L636.0 276.0 L644.0 276.0 Z" fill="#000"/>
<text x="648" y="277" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif" font-style="italic">Yes</text>
<rect x="510.0" y="285.0" width="260" height="50" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="640" y="306.55" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">Merged with it; the items</text>
<text x="640" y="322.55" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">inside named in turn</text>
<path d="M250 280 L250.0 361.0" fill="none" stroke="#000" stroke-width="1"/>
<path d="M250 370 L246.0 361.0 L254.0 361.0 Z" fill="#000"/>
<text x="258" y="300" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif" font-style="italic">No</text>
