<text x="250" y="416.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">Path longer than</text>
<text x="250" y="433.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">the system permits?</text>
