<text x="250" y="118.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">(on Windows Table Ú-2)</text>
<path d="M250 130 L250.0 151.0" fill="none" stroke="#000" stroke-width="1"/>
<path d="M250 160 L246.0 151.0 L254.0 151.0 Z" fill="#000"/>
