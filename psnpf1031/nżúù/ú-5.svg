<text x="40" y="478" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">1. A right-click on an empty spot: the names of the folder are mirrored as empty placeholders.</text>
<text x="40" y="496" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">2. Windows' New menu is initialised on the temporary folder.</text>
<text x="40" y="514" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">3. It fills the submenu Ípmùk with Windows' own entries, names, icons and templates.</text>
<text x="40" y="532" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">4. An entry is picked: Windows creates the item in the temporary folder under its default name.</text>
<text x="40" y="550" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">5. The item is moved into the archive and the view opens its name field (SVSI_EDIT).</text>
<text x="40" y="568" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">6. The journal receives row T for a file or row D for a folder.</text>
