<text x="640" y="44.5" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">3</text>
<text x="40" y="290" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">1. On machine A, an archive on the stick is edited; the journal beside it names files of A and carries the plate of A.</text>
<text x="40" y="310" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">2. The stick is pulled out with the journal pending, and plugged into machine B.</text>
<text x="40" y="330" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">3. On B, the journal is read-only: the archive is listed with its pending changes, but the files of A cannot be</text>
<text x="54" y="350" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">opened there, and nothing is changed, repacked or discarded.</text>
<text x="40" y="370" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">4. Back on A, the journal is its own again, and the archive is repacked when it is next opened and left.</text>
</svg>
