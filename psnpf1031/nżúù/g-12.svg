<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="70.0" y="10.0" width="360" height="50" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="250" y="31.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">Level to list: the archive</text>
<text x="250" y="48.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">or a nested archive in it</text>
<path d="M250 60 L250.0 76.0" fill="none" stroke="#000" stroke-width="1"/>
<path d="M250 85 L246.0 76.0 L254.0 76.0 Z" fill="#000"/>
<path d="M250 85.0 L400.0 130 L250 175.0 L100.0 130 Z" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="250" y="126.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">Section for</text>
<text x="250" y="143.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">this level?</text>
<path d="M400 130 L471.0 130.0" fill="none" stroke="#000" stroke-width="1"/>
<path d="M480 130 L471.0 134.0 L471.0 126.0 Z" fill="#000"/>
<text x="410" y="123" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif" font-style="italic">Yes</text>
<rect x="480.0" y="87.0" width="300" height="86" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="630" y="118.55" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">Entries from the rows: A from the archive,</text>
<text x="630" y="134.55" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">F, M and T from their files (foreign rows</text>
<text x="630" y="150.55" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">listed, not opened); D as empty folders</text>
<path d="M250 175 L250.0 196.0" fill="none" stroke="#000" stroke-width="1"/>
<path d="M250 205 L246.0 196.0 L254.0 196.0 Z" fill="#000"/>
<text x="258" y="193" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif" font-style="italic">No</text>
<rect x="80.0" y="210.0" width="340" height="50" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="250" y="231.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">Entries parsed from the</text>
<text x="250" y="248.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">archive at this level</text>
<path d="M250 260 L250.0 281.0" fill="none" stroke="#000" stroke-width="1"/>
<path d="M250 290 L246.0 281.0 L254.0 281.0 Z" fill="#000"/>
<path d="M630 173 L630 275 L250 275" fill="none" stroke="#000" stroke-width="1"/>
<path d="M250 290.0 L420.0 340 L250 390.0 L80.0 340 Z" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="250" y="327.9" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">Entry a nested archive</text>
<text x="250" y="344.9" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">with a section of</text>
<text x="250" y="361.9" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">its own?</text>
<path d="M420 340 L471.0 340.0" fill="none" stroke="#000" stroke-width="1"/>
<path d="M480 340 L471.0 344.0 L471.0 336.0 Z" fill="#000"/>
<text x="430" y="333" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif" font-style="italic">Yes</text>
<rect x="480.0" y="307.0" width="300" height="66" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="630" y="328.55" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">Shown with the size it will have;</text>
<text x="630" y="344.55" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">built into a temporary file</text>
<text x="630" y="360.55" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">when its content is read</text>
<path d="M250 390 L250.0 411.0" fill="none" stroke="#000" stroke-width="1"/>
<path d="M250 420 L246.0 411.0 L254.0 411.0 Z" fill="#000"/>
<text x="258" y="408" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif" font-style="italic">No</text>
<rect x="80.0" y="425.0" width="340" height="50" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="250" y="446.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">Shown and read as the</text>
<text x="250" y="463.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">row or the archive gives it</text>
</svg>
