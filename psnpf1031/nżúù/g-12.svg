<text x="637.5" y="497.55" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">temporary files; rows H shown</text>
<text x="637.5" y="513.55" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">again unless foreign; archive as stored</text>
