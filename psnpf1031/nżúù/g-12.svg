<path d="M770 580 L779.0 576.0 L779.0 584.0 Z" fill="#000"/>
<text x="766" y="362" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif" font-style="italic">Yes</text>
<rect x="505.0" y="558.0" width="265" height="44" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="637.5" y="584.55" text-anchor="middle" font-size="13" font-family="Times New Roman, Times, serif">Sections dropped; officer kept</text>
<path d="M250 420 L250.0 446.0" fill="none" stroke="#000" stroke-width="1"/>
<path d="M250 455 L246.0 446.0 L254.0 446.0 Z" fill="#000"/>
<text x="258" y="440" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif" font-style="italic">Yes</text>
<rect x="90.0" y="460.0" width="320" height="50" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="250" y="481.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">Archive presented through the</text>
<text x="250" y="498.4" text-anchor="middle" font-size="14" font-family="Times New Roman, Times, serif">journal; read-only if foreign</text>
