<text x="40" y="395" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">1. Programme A takes the lock of the archive; 2. programme B asks for it and waits.</text>
<text x="40" y="415" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">3. A reads the journal; 4. A writes it whole, with its change; 5. A releases the lock.</text>
<text x="40" y="435" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">6. B takes the lock; 7. B reads the journal, which holds the change of A;</text>
<text x="40" y="455" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">8. B writes the journal whole, with both changes, and releases the lock.</text>
