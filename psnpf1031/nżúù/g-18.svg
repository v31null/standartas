<text x="40" y="290" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">1. Join: the car joins the queue and visits the officer until it is waved on.</text>
<text x="40" y="310" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">2. Look: holding the lane, it reads the archive and the journal; where an entry of the change has changed since</text>
<text x="54" y="330" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">the view, the change is refused and the view refreshed.</text>
<text x="40" y="350" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">3. Build: it applies the change by name, writes the new archive beside the old one as a .tmp file, and verifies it.</text>
<text x="40" y="370" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">4. Land: with a green signal, it checks its shift and the archive, replaces the archive, writes the journal and leaves.</text>
