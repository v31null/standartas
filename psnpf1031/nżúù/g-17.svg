<text x="40" y="320" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">1. Holder A stops renewing its lane, as where its machine has frozen; it keeps the lane until its lease runs out.</text>
<text x="40" y="340" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">2. Car B waits at a red signal; a holder that still renews would be waited for without asking.</text>
<text x="40" y="360" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">3. Only two machines are concerned and A has missed its renewals, so the user of B is asked.</text>
<text x="40" y="380" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">4. On Yes, B takes the lane by override; a new shift begins, and a record of custody is written. On No, or</text>
<text x="54" y="400" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">with no answer, nothing changes and the lease of A runs out by itself. A, on its return, finds its shift</text>
<text x="54" y="420" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">gone and abandons its change. With more than two machines, no override: waiting cars may only tag A.</text>
</svg>
