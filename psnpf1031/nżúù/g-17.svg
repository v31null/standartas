<text x="550" y="75" text-anchor="start" font-size="12" font-family="Times New Roman, Times, serif">photos.v31np</text>
<text x="552" y="104" text-anchor="start" font-size="12" font-family="Times New Roman, Times, serif">Still waiting for pingu-346656037</text>
<text x="552" y="120" text-anchor="start" font-size="12" font-family="Times New Roman, Times, serif">(Ubuntu 26.04.1 LTS), which holds this</text>
<text x="552" y="136" text-anchor="start" font-size="12" font-family="Times New Roman, Times, serif">archive. Go ahead anyway?</text>
