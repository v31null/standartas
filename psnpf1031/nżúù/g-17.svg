<text x="40" y="300" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">1. Cars A and B join the queue with tickets 1 and 2; the lane is free.</text>
<text x="40" y="320" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">2. A is waved on and holds the lane; shift 1 begins.</text>
<text x="40" y="340" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">3. A renews its lease while it drives; C joins with ticket 3, marked urgent.</text>
<text x="40" y="360" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">4. A has landed and leaves the lane.</text>
<text x="40" y="380" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">5. C, being urgent, is waved on before B; shift 2 begins, and B waits for its turn.</text>
