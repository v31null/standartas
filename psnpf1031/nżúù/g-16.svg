<text x="40" y="600" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">1. Four machines, one on GNU/Linux and three on Windows, want to change photos.v31np; each joins the queue</text>
<text x="54" y="620" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">at the post with its papers, and receives a ticket in the order of arrival.</text>
<text x="40" y="640" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">2. The officer waves on ticket 1: its signal turns green, and it alone enters the lane.</text>
<text x="40" y="660" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">3. The officer is kept in the journal; every car reads and writes it there, one visit at a time.</text>
<text x="40" y="680" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">4. Tickets 2, 3 and 4 see red, stop at their lines, and wait for their turn, whatever their system.</text>
<text x="40" y="700" text-anchor="start" font-size="13" font-family="Times New Roman, Times, serif">5. Ticket 1 builds and lands its change on photos.v31np and leaves the lane; ticket 2 is waved on next.</text>
</svg>
