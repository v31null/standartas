name: pronal-reach
on: workflow_dispatch
jobs:
  reach:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: run test.exe three times
        shell: pwsh
        working-directory: psnpn1117/psnpn1117r2_test
        run: |
          1..3 | ForEach-Object {
            "--- run $_"
            .\test.exe
            "exit $LASTEXITCODE"
            Start-Sleep -Seconds 25
          }