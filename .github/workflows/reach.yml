name: pronal-reach
on: workflow_dispatch
jobs:
  reach:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: diagnose
        shell: pwsh
        run: |
          curl.exe -sS -o NUL -w "reach GET: %{http_code}`n" https://pronal.v31null.de/API1/mesh/reach.php
          curl.exe -sS https://api.ipify.org
      - name: run test.exe three times
        shell: pwsh
        working-directory: psnpn1117/psnpn1117r2_test
        run: |
          1..3 | ForEach-Object {
            "--- run $_"
            .\test.exe
            "exit $LASTEXITCODE"
            Start-Sleep -Seconds 25
          }